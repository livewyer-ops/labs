apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: llm-gw
  annotations:
    # No public IP: the endpoint has no auth, and the tests run inside the cluster.
    gateway.buoyant.io/service-type: ClusterIP
spec:
  gatewayClassName: buoyant-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: chat
spec:
  parentRefs:
    - name: llm-gw
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - group: kinference.buoyant.io
          kind: InferencePool
          name: chat
---
# The pool every test routes through. Tests swap the policy named `active`.
apiVersion: kinference.buoyant.io/v1alpha1
kind: InferencePool
metadata:
  name: chat
spec:
  destinations:
    - { kind: InferenceWorkerSet, name: vllm }
    - { kind: InferenceProvider, name: mock-provider }
  policyRef:
    name: active
